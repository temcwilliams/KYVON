name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -n auto
      - name: Static security analysis
        run: bandit -q -c pyproject.toml -r kyvon
      - name: Dependency advisories
        run: pip-audit -r requirements.txt
      - name: Migrations apply to a fresh database
        env:
          GROQ_API_KEY: ci-placeholder
          KYVON_DATA_DIR: ${{ runner.temp }}/kyvon-data
        run: flask --app wsgi kyvon db-upgrade
      - name: JavaScript syntax check
        run: |
          for f in web/js/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs"
          done

  postgres:
    # The hosted service runs on PostgreSQL: run the real migrations and the hosted journey against one.
    runs-on: ubuntu-24.04
    env:
      KYVON_TEST_POSTGRES_URL: postgresql+psycopg://kyvon:kyvon-ci-only@localhost:5432/kyvon_test
    steps:
      - uses: actions/checkout@v4
      - name: Start the PostgreSQL preinstalled on the runner image
        # No container registry involved, so no pull rate limits.
        run: |
          sudo systemctl start postgresql
          for i in $(seq 1 30); do sudo -u postgres pg_isready -q && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE kyvon LOGIN SUPERUSER PASSWORD 'kyvon-ci-only'"
          sudo -u postgres createdb -O kyvon kyvon_test
          pg_isready -h localhost -p 5432 -U kyvon -d kyvon_test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Hosted tests on PostgreSQL
        run: pytest tests/test_postgres.py -v
      - name: Migrations apply to a fresh PostgreSQL database
        env:
          GROQ_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+psycopg://kyvon:kyvon-ci-only@localhost:5432/kyvon_test
          KYVON_DATA_DIR: ${{ runner.temp }}/kyvon-pg-data
          KYVON_MODE: hosted
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ['DATABASE_URL'])
          with e.begin() as c:
              c.execute(text('DROP SCHEMA public CASCADE')); c.execute(text('CREATE SCHEMA public'))
          "
          flask --app wsgi kyvon db-upgrade
          flask --app wsgi kyvon doctor

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # Anonymous pulls get rate limited (429) on every public registry from shared runners, so
        # try several mirrors of the same official image, with retries, before giving up.
        run: |
          for base in public.ecr.aws/docker/library/python:3.12-slim mirror.gcr.io/library/python:3.12-slim python:3.12-slim; do
            for attempt in 1 2 3; do
              if docker build --build-arg BASE_IMAGE="$base" -t kyvon:ci .; then exit 0; fi
              echo "build failed from $base (attempt $attempt)"; sleep $((attempt * 15))
            done
          done
          exit 1

  ios:
    # The Swift client has never been compiled locally (no usable Xcode on the dev machine), so
    # GitHub's macOS runners are where it gets built and tested.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build the package (macOS)
        run: swift build
      - name: Unit tests (API client, SSE, models)
        run: swift test
      - name: Build for the iOS simulator
        run: |
          xcodebuild -scheme KYVONApp -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO

  ios-ipa:
    # An UNSIGNED app file for sideloading from Windows (Sideloadly / AltStore re-sign it with a free
    # Apple ID; it then expires after 7 days). Push entitlement is left out: free accounts can't sign it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive without signing
        working-directory: ios
        run: |
          xcodebuild -project KYVON.xcodeproj -scheme KYVON -configuration Release -sdk iphoneos \
            -archivePath build/KYVON.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/KYVON.xcarchive/Products/Applications/KYVON.app Payload/
          zip -qry KYVON-unsigned.ipa Payload
          ls -lh KYVON-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: KYVON-unsigned-ipa
          path: ios/KYVON-unsigned.ipa
          retention-days: 14

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
