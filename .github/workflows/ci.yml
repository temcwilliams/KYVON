name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -n auto
      - name: Static security analysis
        run: bandit -q -c pyproject.toml -r kyvon
      - name: Dependency advisories
        run: pip-audit -r requirements.txt
      - name: Migrations apply to a fresh database
        env:
          GROQ_API_KEY: ci-placeholder
          KYVON_DATA_DIR: ${{ runner.temp }}/kyvon-data
        run: flask --app wsgi kyvon db-upgrade
      - name: JavaScript syntax check
        run: |
          for f in web/js/*.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs"
          done

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kyvon:ci .

  ios:
    # The Swift client has never been compiled locally (no usable Xcode on the dev machine), so
    # GitHub's macOS runners are where it gets built and tested.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build the package (macOS)
        run: swift build
      - name: Unit tests (API client, SSE, models)
        run: swift test
      - name: Build for the iOS simulator
        run: |
          xcodebuild -scheme KYVONApp -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
