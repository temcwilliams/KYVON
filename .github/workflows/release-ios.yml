name: Release iOS (unsigned)

# Publishes KYVON-unsigned.ipa as a public GitHub Release so the website's download link works.
# Run it by pushing a tag such as v1.0.0, or from the Actions tab ("Run workflow").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive without signing
        working-directory: ios
        run: |
          xcodebuild -project KYVON.xcodeproj -scheme KYVON -configuration Release -sdk iphoneos \
            -archivePath build/KYVON.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/KYVON.xcarchive/Products/Applications/KYVON.app Payload/
          zip -qry KYVON-unsigned.ipa Payload
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" ios/KYVON-unsigned.ipa \
            --title "KYVON $TAG (unsigned, for sideloading)" \
            --notes "Unsigned iPhone/iPad build for sideloading with a free Apple ID (Sideloadly or AltStore). Not tested on a real device. See the website for steps." \
            --prerelease
