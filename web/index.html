<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1216">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="KYVON">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>KYVON</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <a class="skip-link" href="#messageInput">Skip to message box</a>

    <div class="background"></div>

    <div class="app">

        <aside id="drawer" class="drawer" aria-label="Menu">
            <div class="drawer-head">
                <div class="drawer-title">Menu</div>
                <button id="drawerClose" class="mini" aria-label="Close menu">Close</button>
            </div>
            <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
            <div id="panel" class="panel" role="tabpanel"></div>
        </aside>
        <div id="scrim" class="scrim"></div>

        <main class="kyvon">

            <div id="offlineBanner" class="offline-banner" role="status" hidden>
                You're offline. KYVON will reconnect automatically.
            </div>

            <header>
                <button id="menuButton" class="menu-button" aria-label="Open menu" aria-expanded="false"
                    aria-controls="drawer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
                <div class="brand">KYVON</div>
                <button id="bellButton" class="icon-button bell" aria-label="Inbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="bellBadge" class="badge" hidden>0</span></button>
                <div id="status" class="status" role="status" aria-live="polite">Connecting</div>
            </header>

            <div class="core idle" aria-hidden="true">
                <span class="core-dot"></span>
                <span id="listening" class="listening">Ready</span>
            </div>

            <section id="conversation" class="conversation" role="log" aria-live="polite"
                aria-label="Conversation" tabindex="0">
                <div class="message kyvon-message">
                    <span class="speaker">KYVON:</span>
                    <span class="message-text">Hi, I'm KYVON. What can I help you with?</span>
                </div>
            </section>

            <section class="input-area">
                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message KYVON"
                    autocomplete="off"
                    aria-label="Message to KYVON"
                >
                <button id="micButton" class="icon-button" data-state="idle" aria-label="Voice input">
                    <svg class="i-idle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
                    <svg class="i-recording" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
                    <svg class="i-transcribing" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="18" cy="12" r="1.2" fill="currentColor"/></svg>
                    <svg class="i-speaking" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path d="m16 9 4 6m0-6-4 6"/></svg>
                </button>
                <button id="sendButton" class="primary icon-button" data-busy="false" aria-label="Send message">
                    <svg class="i-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                    <svg class="i-stop" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
                </button>
            </section>

            <footer>
                <button id="systemButton" class="ghost">System</button>
                <button id="memoryButton" class="ghost">Memory</button>
                <button id="clearButton" class="ghost">New chat</button>
                <button id="logoutButton" class="ghost">Sign out</button>
            </footer>

        </main>
    </div>

    <div id="login" class="login" hidden>
        <form id="loginForm">
            <div class="login-title wordmark">KYVON</div>
            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                aria-label="Username"
                autocomplete="username"
                autocapitalize="none"
                required
            >
            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                aria-label="Password"
                autocomplete="current-password"
                required
            >
            <button type="submit" class="primary">Sign in</button>
            <div id="loginError" class="login-error" role="alert"></div>
            <div id="loginLinks" class="login-links" hidden>
                <button type="button" id="showSignup" class="link">Create an account</button>
                <button type="button" id="showForgot" class="link">Forgot password?</button>
            </div>
        </form>

        <form id="signupForm" hidden>
            <div class="login-title">Create your account</div>
            <input id="signupEmail" type="email" placeholder="Email" aria-label="Email address"
                autocomplete="email" autocapitalize="none" required>
            <input id="signupPassword" type="password" placeholder="Password (10+ characters)"
                aria-label="Password" autocomplete="new-password" minlength="10" required>
            <label class="check">
                <input id="signupTerms" type="checkbox" required>
                <span id="signupTermsText">I am 16 or older and I agree to the terms of use and privacy policy.</span>
            </label>
            <button type="submit" class="primary">Create account</button>
            <div id="signupMessage" class="login-error" role="alert"></div>
            <button type="button" class="link" data-back="1">Back to sign in</button>
        </form>

        <form id="forgotForm" hidden>
            <div class="login-title">Reset your password</div>
            <input id="forgotEmail" type="email" placeholder="Email" aria-label="Email address"
                autocomplete="email" autocapitalize="none" required>
            <button type="submit" class="primary">Send reset link</button>
            <div id="forgotMessage" class="login-error" role="alert"></div>
            <button type="button" class="link" data-back="1">Back to sign in</button>
        </form>

        <form id="resetForm" hidden>
            <div class="login-title">Choose a new password</div>
            <input id="resetPassword" type="password" placeholder="New password (10+ characters)"
                aria-label="New password" autocomplete="new-password" minlength="10" required>
            <button type="submit" class="primary">Save password</button>
            <div id="resetMessage" class="login-error" role="alert"></div>
            <button type="button" class="link" data-back="1">Back to sign in</button>
        </form>
    </div>

    <script type="module" src="/static/js/main.js"></script>

</body>

</html>
