<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="KYVON">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>KYVON</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <a class="skip-link" href="#messageInput">Skip to message box</a>

    <div class="background"></div>

    <div class="app">

        <aside id="drawer" class="drawer" aria-label="Menu">
            <div class="drawer-head">
                <div class="drawer-title">MENU</div>
                <button id="drawerClose" class="mini" aria-label="Close menu">Close</button>
            </div>
            <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
            <div id="panel" class="panel" role="tabpanel"></div>
        </aside>
        <div id="scrim" class="scrim"></div>

        <main class="kyvon">

            <div id="offlineBanner" class="offline-banner" role="status" hidden>
                You're offline. KYVON will reconnect automatically.
            </div>

            <header>
                <button id="menuButton" class="menu-button" aria-label="Open menu" aria-expanded="false"
                    aria-controls="drawer">☰</button>
                <div class="brand">KYVON</div>
                <button id="bellButton" class="icon-button bell" aria-label="Inbox">🔔<span id="bellBadge" class="badge" hidden>0</span></button>
                <div id="status" class="status" role="status" aria-live="polite">CONNECTING</div>
            </header>

            <section class="core" aria-hidden="true">
                <div class="ring ring-one"></div>
                <div class="ring ring-two"></div>
                <div class="ring ring-three"></div>

                <div class="core-center">
                    <div class="core-text">KYVON</div>
                    <div id="listening" class="listening">STANDBY</div>
                </div>
            </section>

            <section id="conversation" class="conversation" role="log" aria-live="polite"
                aria-label="Conversation" tabindex="0">
                <div class="message kyvon-message">
                    <span class="speaker">Kyvon:</span>
                    <span>Systems initialized. How may I assist?</span>
                </div>
            </section>

            <section class="input-area">
                <input
                    id="messageInput"
                    type="text"
                    placeholder="Speak or type to KYVON..."
                    autocomplete="off"
                    aria-label="Message to KYVON"
                >
                <button id="sendButton" aria-label="Send message">SEND</button>
                <button id="micButton" aria-label="Voice input">🎙️</button>
            </section>

            <footer>
                <button id="systemButton">SYSTEM</button>
                <button id="memoryButton">MEMORY</button>
                <button id="clearButton">NEW CHAT</button>
                <button id="logoutButton">SIGN OUT</button>
            </footer>

        </main>
    </div>

    <div id="login" class="login" hidden>
        <form id="loginForm">
            <div class="login-title">KYVON</div>
            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                aria-label="Username"
                autocomplete="username"
                autocapitalize="none"
                required
            >
            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                aria-label="Password"
                autocomplete="current-password"
                required
            >
            <button type="submit">SIGN IN</button>
            <div id="loginError" class="login-error" role="alert"></div>
            <div id="loginLinks" class="login-links" hidden>
                <button type="button" id="showSignup" class="link">Create an account</button>
                <button type="button" id="showForgot" class="link">Forgot password?</button>
            </div>
        </form>

        <form id="signupForm" hidden>
            <div class="login-title">CREATE ACCOUNT</div>
            <input id="signupEmail" type="email" placeholder="Email" aria-label="Email address"
                autocomplete="email" autocapitalize="none" required>
            <input id="signupPassword" type="password" placeholder="Password (10+ characters)"
                aria-label="Password" autocomplete="new-password" minlength="10" required>
            <label class="check">
                <input id="signupTerms" type="checkbox" required>
                <span id="signupTermsText">I am 16 or older and I agree to the terms of use and privacy policy.</span>
            </label>
            <button type="submit">CREATE ACCOUNT</button>
            <div id="signupMessage" class="login-error" role="alert"></div>
            <button type="button" class="link" data-back="1">Back to sign in</button>
        </form>

        <form id="forgotForm" hidden>
            <div class="login-title">RESET PASSWORD</div>
            <input id="forgotEmail" type="email" placeholder="Email" aria-label="Email address"
                autocomplete="email" autocapitalize="none" required>
            <button type="submit">SEND RESET LINK</button>
            <div id="forgotMessage" class="login-error" role="alert"></div>
            <button type="button" class="link" data-back="1">Back to sign in</button>
        </form>

        <form id="resetForm" hidden>
            <div class="login-title">NEW PASSWORD</div>
            <input id="resetPassword" type="password" placeholder="New password (10+ characters)"
                aria-label="New password" autocomplete="new-password" minlength="10" required>
            <button type="submit">SAVE PASSWORD</button>
            <div id="resetMessage" class="login-error" role="alert"></div>
            <button type="button" class="link" data-back="1">Back to sign in</button>
        </form>
    </div>

    <script type="module" src="/static/js/main.js"></script>

</body>

</html>
