# Example Cloudflare Tunnel configuration (/etc/cloudflared/config.yml).
# KYVON keeps listening on 127.0.0.1:8080 exactly as before; the tunnel provides HTTPS.
tunnel: <your-tunnel-id>
credentials-file: /etc/cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: kyvon.example.com
    service: http://localhost:8080
    originRequest:
      # Streaming replies (Server-Sent Events) must not be buffered or cut early.
      connectTimeout: 30s
      noTLSVerify: false
  - service: http_status:404

# Then set in KYVON's .env:
#   KYVON_ENV=production
#   KYVON_PUBLIC_URL=https://kyvon.example.com
#   KYVON_COOKIE_SECURE=true
# Cloudflare drops connections that are idle for about 100 seconds; a very long tool run
# (a research agent) can outlast that. The reply is still saved and appears when the page reloads.
