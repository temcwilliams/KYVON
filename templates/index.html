<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>J.A.R.V.I.S.</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="background"></div>

    <main class="kyvon">

        <header>

            <div class="brand">
                J.A.R.V.I.S.
            </div>

            <div
                id="status"
                class="status"
            >
                CONNECTING
            </div>

        </header>


        <section class="core">

            <div class="ring ring-one"></div>
            <div class="ring ring-two"></div>
            <div class="ring ring-three"></div>

            <div class="core-center">
                <div class="core-text">
                    KYVON
                </div>

                <div
                    id="listening"
                    class="listening"
                >
                    STANDBY
                </div>
            </div>

        </section>


        <section
            id="conversation"
            class="conversation"
        >

            <div class="message kyvon-message">
                <span class="speaker">
                    Kyvon:
                </span>

                <span>
                    Systems initialized. How may I assist?
                </span>
            </div>

        </section>


        <section class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Speak or type to KYVON..."
                autocomplete="off"
            >

            <button
                id="sendButton"
            >
                SEND
            </button>

            <button
                id="micButton"
            >
                🎙️
            </button>

        </section>


        <footer>

            <button
                onclick="runDiagnostics()"
            >
                SYSTEM
            </button>

            <button
                onclick="showMemory()"
            >
                MEMORY
            </button>

            <button
                onclick="clearConversation()"
            >
                CLEAR
            </button>

        </footer>

    </main>

    <script src="/static/app.js"></script>

</body>

</html>
